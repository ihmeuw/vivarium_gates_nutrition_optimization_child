[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_nutrition_optimization_child"
description = "Research repository for the vivarium_gates_nutrition_optimization_child project."
readme = "README.rst"
# Kept in sync with python_versions.json, which the Makefile and CI read.
requires-python = ">=3.11,<3.12"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
# Declared statically rather than derived by setuptools_scm (as the framework
# repos do): this repo's only tag, ``v1.0``, is not reachable from ``main``, so
# setuptools_scm resolves to ``0.0.1.dev<N>+no.git.tag`` — lower than the value
# this carried before. Carried over verbatim from the deleted ``__about__.py``
# to keep the built version unchanged; note it already disagreed with
# CHANGELOG.rst (v0.12.1). Tag ``main``, then switch to ``[tool.setuptools_scm]``.
version = "0.7.0"
dependencies = [
    "vivarium-gbd-mapping>=6.0.0,<7.0.0",
    "vivarium-engine>=5.3.0,<6.0.0",
    "vivarium-public-health>=6.3.1,<7.0.0",
    "vivarium-config-tree",
    "vivarium-risk-distributions",
    "vivarium_build_utils>=4.0.0,<5.0.0",
    "click",
    "jinja2",
    "loguru",
    "numpy",
    "pandas<3.0.0",
    "pyyaml",
    "scipy",
    "tables",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
]
cluster = ["vivarium_cluster_tools>=4.0.0,<5.0.0"]
lint = [
    "black==22.3.0",
    "isort==5.13.2",
]
data = [
    "vivarium_inputs>=5.0.0,<7.0.0",
    "vivarium_gbd_access>=4.0.0,<5.0.0",
    "vivarium_gates_nutrition_optimization_child[cluster]",
]
dev = ["vivarium_gates_nutrition_optimization_child[test,cluster,lint]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_nutrition_optimization_child"

[project.scripts]
make_artifacts = "vivarium_gates_nutrition_optimization_child.tools.cli:make_artifacts"

[tool.setuptools.packages.find]
where = ["src"]

# Data files loaded at runtime from inside the installed package (see
# ``constants/paths.py``, which resolves them relative to ``__file__``).
[tool.setuptools.package-data]
"vivarium_gates_nutrition_optimization_child" = ["**/*.csv", "**/*.yaml", "**/*.ipynb"]

[tool.black]
line_length = 94

[tool.isort]
profile = "black"
known_third_party = ["vivarium", "vivarium_public_health"]

[tool.coverage.run]
source = ["vivarium_gates_nutrition_optimization_child"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests/"]
