[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_nutrition_optimization_child"
description = "Research repository for the vivarium_gates_nutrition_optimization_child project."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
version = "0.7.0"
dependencies = [
    "vivarium-gbd-mapping>=6.0.0,<7.0.0",
    "vivarium-engine>=5.3.0,<6.0.0",
    "vivarium-public-health>=6.3.1,<7.0.0",
    "vivarium-config-tree",
    "vivarium-risk-distributions",
    "vivarium_build_utils>=4.0.0,<5.0.0",
    "click",
    "jinja2",
    "loguru",
    "numpy",
    "pandas<3.0.0",
    "pyyaml",
    "scipy",
    "tables",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
]
cluster = ["vivarium_cluster_tools>=4.0.0,<5.0.0"]
lint = [
    "black==22.3.0",
    "isort==5.13.2",
]
data = [
    "vivarium_inputs>=5.0.0,<7.0.0",
    "vivarium_gbd_access>=4.0.0,<5.0.0",
    "vivarium_gates_nutrition_optimization_child[cluster]",
]
dev = ["vivarium_gates_nutrition_optimization_child[test,cluster,lint]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_nutrition_optimization_child"

[project.scripts]
make_artifacts = "vivarium_gates_nutrition_optimization_child.tools.cli:make_artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vivarium_gates_nutrition_optimization_child" = ["**/*.csv", "**/*.yaml", "**/*.ipynb"]

[tool.black]
line_length = 94

[tool.isort]
profile = "black"
known_third_party = ["vivarium", "vivarium_public_health"]

[tool.coverage.run]
source = ["vivarium_gates_nutrition_optimization_child"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests/"]
